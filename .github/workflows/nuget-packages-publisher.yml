name: NuGet packages publisher

on:
  workflow_dispatch:
    inputs:
      project:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Pack
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet pack "src/${{ inputs.project }}" \
            -c Release \
            -o ./artifacts \
            -p:PackageVersion="${VERSION#v}"

      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ github.repository_owner }}

      - name: Publish
        shell: bash
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
